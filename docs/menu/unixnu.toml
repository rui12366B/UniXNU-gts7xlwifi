version = 1

[boot]
timeout = 3
fallback_timeout = 3
default = "gts7xlwifi"
rotate = 0
connect_all = true

[ui]
title = "T970 - UniXNU gts7xlwifi"

[kits]
autoload = false

[[entry]]
id = "restart"
title = "Restart to Android default menu"
type = "action"
action = "reset"

[[entry]]
id = "twrp"
title = "Restart to TWRP (recovery)"
type = "action"
action = "recovery"

[[entry]]
id = "gts7xlwifi"
title = "UniXNU gts7xlwifi periph15 (shutdown, charger watchdog, CollectionsPoster GPU, 4+3+1, DVFS, battery)"
type = "xnu"
path = "Payloads/gts7xlwifi/kernel.macho"
args = "kt_fixed_zones=120 sheng-smp=1 armcpu-spi-ipi=1 armcpu-spi-ipi-base=544 armcpu-self-ipi=1 boot-progress=3 sheng-pmgr=2 native-ufs-root=1 native-ufs-stream=0xe0 native-ufs-stream2=0x4e0 t970-ufs-data=1 ufsrw=1 t970-dram-end=0x280000000 panic_on_crash_disabled=1 offline-mobile-graphics-load=1 offline-legacy-pm=1 offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-validate=1 offline-legacy-phase=4 offline-legacy-transfer=1 offline-legacy-cpu-present=1 sheng-vsync=60 sheng-lite=1 sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined sheng-disable-watchdogd=1 sheng-aks=1 offline-hid-input=1 offline-key-events=1 alioth-bt=1 sheng-log=1 sheng-cpufreq=4 sheng-cpufreq-cap=2000 qcom-usb-debug=1 qcom-usb-ctl=1 t970-fb-wc=1 t970-fb-src-wb=1 pipa-gpu=12 pipa-turnip-debug=noubwc,nocb sheng-gpu-addon=1 sheng-fb-gpu=1 native-touch=1 sheng-touch-hid=1 t970-touch-xform=5 t970-wifi=4 sheng-dpu-scanout=2 t970-qud-resume=1 t970-qud-retry=1 log-gpu=1 t970-battery=1"

[[entry]]
id = "gts7xlwifi-copy"
title = "UniXNU gts7xlwifi periph15 (copy, shutdown, charger watchdog, 4+3+1, DVFS, battery)"
type = "xnu"
path = "Payloads/gts7xlwifi/kernel.macho"
args = "kt_fixed_zones=120 sheng-smp=1 armcpu-spi-ipi=1 armcpu-spi-ipi-base=544 armcpu-self-ipi=1 boot-progress=3 sheng-pmgr=2 native-ufs-root=1 native-ufs-stream=0xe0 native-ufs-stream2=0x4e0 t970-ufs-data=1 ufsrw=1 t970-dram-end=0x280000000 panic_on_crash_disabled=1 offline-mobile-graphics-load=1 offline-legacy-pm=1 offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-validate=1 offline-legacy-phase=4 offline-legacy-transfer=1 offline-legacy-cpu-present=1 sheng-vsync=60 sheng-lite=1 sheng-disable-jobs=com.apple.liveactivitiesd,com.apple.cryptexd,com.apple.routined sheng-disable-watchdogd=1 sheng-aks=1 offline-hid-input=1 offline-key-events=1 alioth-bt=1 sheng-log=1 sheng-cpufreq=4 sheng-cpufreq-cap=2000 qcom-usb-debug=1 qcom-usb-ctl=1 t970-fb-wc=1 t970-fb-src-wb=1 pipa-gpu=12 pipa-turnip-debug=noubwc,nocb sheng-gpu-addon=1 sheng-fb-gpu=1 native-touch=1 sheng-touch-hid=1 t970-touch-xform=5 t970-wifi=4 t970-qud-resume=1 t970-qud-retry=1 log-gpu=1 t970-battery=1"
