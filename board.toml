schema_version = 2

[board]
example = true
name = "gts7xlwifi"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab S7+ Wi-Fi (SM-T970, gts7xlwifi); scaffold, hardware values pending"
kit = "gts7xlwifi"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "gts7xlwifi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/gts7xlwifi.dts"
include_dirs = ["soc:dts"]

[firmware]
# Replace with this board's UEFI configuration and paths.
config = "example"
dsc = "Platforms/Vendor/examplePkg/example.dsc"
fd = "Build/examplePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "example"

[payload]
volume = "EXAMPLE"
size_mib = 192
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3"]

[payload.adt]
# chip_id/identity: REQUIRED from this board; never copy umi or T733 values.
# Supply the board's identity seed through --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
