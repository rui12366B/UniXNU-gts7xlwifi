]

[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["scripts/check-*", "scripts/probe-*", "scripts/audit-*", "scripts/read-*", "scripts/prepare-*", "scripts/data/**", "package/Boot*", "package/*Probe*", "tools/**", "docs/evidence/**", "drivers/QcomXnuUsbDebug/**", "patches/xnu/t970-qcom-usb-debug-*.patch"]
inputs = ["Boot log ring in a spare partition; DWC3 CDC-ACM debug console behind the MAX77705 MUIC switch."]
configuration = ["qcom-usb-debug=1 qcom-usb-ctl=1 t970-qud-resume=1 t970-qud-retry=1; boot-progress=3."]
procedure = ["tools/read-boot-log.py from TWRP; on macOS read /dev/cu.usbmodem*."]
findings = ["The USB-C D+/D- reach the SoC only through the MAX77705 analog switch, which iPadOS found open (CONTROL1 0x3f); writing COM_USB (0x09) over the opcode mailbox brought up the console. The HS PHY needs QSCRATCH utmi-as-pipe and VBUS override."]
completion = ["The Mac enumerates Qualcomm XNU Debug and streams the log from boot."]
limits = ["No Apple USB device stack (Finder/usbmux)."]
next_action = ["Port an IOUSBDeviceFamily DWC3 controller (UniXNU-alioth AliothUSBDevice)."]
evidence = [
  {kind = "device", reference = "docs/evidence/usb-console.txt", result = "QCOM XNU USB CDC ACM v1 and live rows on /dev/cu.usbmodem1101.", command = "macOS: read /dev/cu.usbmodem* while the periph15 payload runs", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "[t970 muic] CONTROL1 0x3f -> 0x09; QCOM USB ACTIVE (CDC-ACM up).", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
