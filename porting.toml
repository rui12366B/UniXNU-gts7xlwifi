schema_version = 1

[device]
name = "gts7xlwifi"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy Tab S7+ Wi-Fi (SM-T970). iPadOS 17.7.11 desktop with 8 cores in 4+3+1 clusters and DVFS, native UFS root and Data, GPU-composited UI (Adreno 650), touch, brightness, USB debug console and battery; Wi-Fi at PCIe stage 4."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "local.toml.example", "unixnu.lock", "LICENSE", "AGENTS.md", "MIGRATION.md", "README.md", "README_EN.md"]
inputs = ["SM8250 layer FFT-infra/UniXNU-sm8250-common 166235ec; iPadOS 17.7.11 21H461 kernelcache as prelink donor."]
configuration = ["board.toml [components] include, [kernel] patch_series (arch, soc, device before-os, os, device), [payload] text_fixups and ADT product strings."]
procedure = ["./unixnu build kernel; ./unixnu build payload --trust-cache <owner trust cache>."]
findings = ["A payload built without --trust-cache lacks the ADT trust-cache slot and the boot menu reports Compromised Data.", "board.description is the catalog title; it names the working functions so this record is told apart from the single-core sm-t970 bootstrap."]
completion = ["All source pins resolve and the kernel, prelink and payload build."]
limits = ["Built against a UniXNU-next checkout with docs/host-patches applied."]
next_action = ["Drop the host patches once equivalent changes land upstream."]
evidence = [
  {kind = "source", reference = "board.toml", result = "Board configuration with component selection, patch order and payload ADT strings."},
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/gen-gpu-firmware-a650.py", "docs/menu/**"]
inputs = ["Samsung bootloader T970 with a UEFI boot selector on the boot partition (separate firmware tree), ESP with EFI/UniXNU."]
configuration = ["docs/menu/unixnu.toml: kernel command line <= 1000 bytes; payload at Payloads/gts7xlwifi."]
procedure = ["Copy kernel.macho, kernel.macho.adt and the trust cache to the ESP; choose the UniXNU entry in the menu (the selector defaults to TWRP after adb reboot)."]
findings = ["The A650 GMU/SQE/ZAP images are compiled in; scripts/gen-gpu-firmware-a650.py rebuilds the source from the tablet files, reassembling the ZAP ELF from its .b0N segments."]
completion = ["The menu starts XNU with the payload and its ADT."]
limits = ["The UEFI firmware itself is not in this repository."]
next_action = ["Publish the UEFI firmware tree or pin it."]
evidence = [
  {kind = "source", reference = "proprietary-files.txt", result = "Firmware inputs with sources and SHA-256."},
]

[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "drivers/ArmCpu/**", "patches/xnu/t970-three-clusters.patch", "dts/**"]
inputs = ["Kryo 585: 4x A55 (EPSS domain 0x18591000), 3x A77 (0x18592000), 1x A77 prime (0x18593000); GICv3; TSENS 0xc263000/0xc265000."]
configuration = ["armcpu-spi-ipi=1 armcpu-spi-ipi-base=544; DTS unixnu,cluster-type and unixnu,die-cluster-id 0/1/2; sheng-cpufreq=4 sheng-cpufreq-cap=2000."]
procedure = ["Boot with all 8 cores; read SMP and CPUFREQ rows of the boot log."]
findings = ["SGI/SPI 1008..1015 are group-0 secure on this firmware, so IPIs use software-pended SPIs from 544. MPIDR AFF1 numbers single cores in one DynamIQ cluster, so the scheduling cluster comes from die-cluster-id (t970-three-clusters.patch, with the SM-T733 boot-cluster fallback). DVFS: perfcontrol class and 200 ms load per EPSS domain, 10 ms worker (after SM-T733 T733CpuPower)."]
completion = ["Seven secondary cores reach step 7; each EPSS domain changes level with load."]
limits = ["TSENS uses the hottest sensor only; no per-cluster thermal zones."]
next_action = ["Group TSENS sensors per cluster as SM-T733 T733Thermal."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "SMP c1..c7=step7; CPUFREQ d0 1804 MHz, d1 1958 MHz, d2 844 MHz idle with 601 level changes.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "memory"
status = "device-verified"
components = []
paths = ["dts/**", "patches/xnu/t970-dram-extend.patch", "patches/xnu/t970-dram-holes.patch"]
inputs = ["DRAM above the 2 GiB owned window up to t970-dram-end, with firmware holes."]
configuration = ["t970-dram-end=0x280000000; /chosen/t970-dram-holes."]
procedure = ["Boot and read the MEM row."]
findings = ["XNU manages DRAM beyond the first window once the holes are skipped."]
completion = ["totalMiB reflects the extended range."]
limits = ["DMA engines use their own SMMU contexts per driver."]
next_action = ["Raise t970-dram-end further per the RAM plan."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "MEM totalMiB=5969.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot", "AppleKeyStoreState"]
paths = ["drivers/ShengUfs/**", "patches/xnu/t970-ufs-data-mount.patch", "patches/xnu/t970-migrate-once.patch", "patches/xnu/t970-mgcache-once.patch", "scripts/build-storage-bindings.py", "scripts/build-root-policy-archive.py", "scripts/data/original-storage-bindings.S"]
inputs = ["UFS host (NativeUfs-alioth ab54059); signed OS image and Data container on a spare partition."]
configuration = ["native-ufs-root=1 native-ufs-stream=0xe0 t970-ufs-data=1 ufsrw=1."]
procedure = ["Boot and read the UFS row."]
findings = ["Root reads are verified per 4 KiB block; Data persists across boots."]
completion = ["No UFS failures or integrity errors over a full desktop session."]
limits = ["Shutdown hangs unmounting the OS volume after IOServicePH::systemHalt; the UFS driver stops serving I/O there."]
next_action = ["Serve I/O until the halt callback and flush, as SM-T733 native_ufs_shutdown_complete."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "UFS requests=321101 verified4K=1136628 failures=0 integrity=0.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer"]
paths = ["drivers/GopFramebuffer/**", "package/LegacyDisplayProbe.cpp", "package/Backlight*", "patches/xnu/t970-text-repage.patch", "patches/xnu/t970-ui-trace.patch"]
inputs = ["S6TUUM3 dual-DSI 2800x1752 panel, UEFI GOP framebuffer at 0x9c000000, DPU direct scanout."]
configuration = ["sheng-dpu-scanout=2; ADT artwork-display-gamut = sRGB; 12 text_fixups (SM-T733 21H461 sRGB/BGRA8 policy)."]
procedure = ["Boot to the desktop; read DISPLAY and SWAP rows."]
findings = ["CoreAnimation XR10/b3a8 composition striped on A650 although every single format-550 operation probed exact; forcing sRGB BGRA8 (text_fixups + gamut) removed the stripes. text repage keeps the fixups after a code page is evicted."]
completion = ["Desktop without stripes; swaps retire by direct scanout."]
limits = ["120 Hz and brightness curve are not tuned."]
next_action = ["Measure frame pacing with the GPU frame trace."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "DISPLAY stage=10; SWAP retired=1438 with 2 copies; [text fixup] applied=12.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "input"
status = "device-verified"
components = ["ShengHidInput", "ShengNovatekTouch", "QcomGeniSpi"]
paths = ["drivers/ShengHidInput/**", "package/T970FtsTouch.cpp", "package/HidInputProbe.cpp", "package/Button*"]
inputs = ["STM fts1ba90a at I2C 0x49 on QUP SE5 pins 12/13, attention GPIO 15; PMIC keys."]
configuration = ["native-touch=1 sheng-touch-hid=1 t970-touch-xform=5 offline-hid-input=1."]
procedure = ["Touch the desktop; read TOUCHSTAT on the USB console."]
findings = ["The panel bus is driven as a GPIO I2C master; ShengNovatekTouch and QcomGeniSpi come in as catalog dependencies of ShengHidInput and are not used by this board."]
completion = ["Touches reach SpringBoard as HID events."]
limits = ["No palm rejection or S Pen."]
next_action = ["Add the S Pen digitizer."]
evidence = [
  {kind = "device", reference = "docs/evidence/usb-console.txt", result = "TOUCHSTAT frames and HID submissions on the live console.", command = "macOS: read /dev/cu.usbmodem* while the periph15 payload runs", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "gpu"
status = "device-verified"
components = []
paths = ["drivers/Adreno650/**", "kits/**", "package/Gpu*", "package/T970GpuAddon.S", "scripts/build-adreno650.py", "scripts/t970-addon-add.py", "scripts/data/xr10-probe/**", "patches/xnu/t970-gpu-addon-embedded.patch", "patches/xnu/t970-sandbox-grant-entitlement.patch", "docs/host-patches/**"]
inputs = ["Adreno 650 (A650 GMU/SQE/ZAP), apps SMMU GPU context; AdrenoMetal userspace (metal2vulkan + Turnip) in an embedded addon."]
configuration = ["pipa-gpu=12 sheng-gpu-addon=1 sheng-fb-gpu=1; NativeSandboxGrantEntitlement = opengl-or-metal, posterkit.provider."]
procedure = ["Boot to the desktop; read the gpu clients and methods rows."]
findings = ["Wallpaper posters crash-looped on a nil MTLBuffer because MACF denied AGXDeviceUserClient; granting by entitlement (SM-T733) fixed them. A GPU read at 0x1_086de2c0 past the 32-bit window poisoned a VM once (diagnostics [gpu far]/[gpu vmfail] armed)."]
completion = ["backboardd, SpringBoard, widget renderers, posters and Settings composite on the GPU with no map failures."]
limits = ["mediaserverd gets VK_ERROR_INITIALIZATION_FAILED; a latched cb0 FSR 0x400 is not cleared."]
next_action = ["Add an SMMU context fault handler that records and clears FSR."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "gpu clients backboardd 1353M, SpringBoard 609M, CollectionsPoster 512M; BoAlloc/BoMap/Submit 0 failures.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

[[area]]
id = "network"
status = "implemented"
components = []
paths = ["package/T970WifiProbe.cpp", "package/MhiBoot.*", "package/T970Rpmh.inc"]
inputs = ["QCA6390 (17cb:1101) on PCIe0: PERST GPIO 79, CLKREQ 80, WLAN_EN 90; rails smpa4/5/6, smpc8, ldoc5; stream 0x1c01."]
configuration = ["t970-wifi=<stage> (4 = link and endpoint, 5 = BHI firmware)."]
procedure = ["Boot with t970-wifi=4 and read the [t970 wifi] rows."]
findings = ["cmd-db lists several VRM names twice; the first match is used (Linux behaviour). Stage 5 with an SMMU bypass and a 36-bit buffer reset the tablet within 20 s."]
completion = ["Link L0, endpoint identity, BAR and MHI registers readable."]
limits = ["No DMA, MHI, QMI or ath11k yet."]
next_action = ["Give stream 0x1c01 its own SMMU context with 32-bit IOVAs from 0xa0000000 (Chengdong-Yu/pong-wifi), then port its ath11k for QCA6390."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "[t970 wifi] link in 13 ms, endpoint 17cb:1101 class 0x0280, BAR0 at 0x60300000.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

