[[area]]
id = "power"
status = "implemented"
components = []
paths = ["package/T970Battery.cpp", "package/ShengPlatformPower.cpp", "scripts/build-platform-power.py"]
inputs = ["MAX77705 fuel gauge (I2C 0x36) and charger (0x69) on QUP SE0 pins 28/29; PSCI."]
configuration = ["t970-battery=1 sheng-pmgr=2."]
procedure = ["Boot and read the [t970 battery] row; shut down from Settings."]
findings = ["Samsung arms the MAX77705 charger watchdog; unkicked it turns charging off (CHG_DTLS 0xb). The service kicks CHG_CNFG_06 every 10 s."]
completion = ["iPadOS shows the battery level and charge state; halt powers off."]
limits = ["Input current stays at the default USB limit; shutdown does not reach PSCI yet (storage)."]
next_action = ["Set CHGIN_ILIM from the Type-C current; finish the UFS shutdown path."]
evidence = [
  {kind = "device", reference = "docs/evidence/periph15-bootlog.txt", result = "[t970 battery] 100.0 %, 4306 mV, +66 mA, charging, 48 watchdog kicks.", command = "TWRP: python3 tools/read-boot-log.py --port <adb serial> --out logs (after booting the periph15 payload, docs/menu/unixnu.toml)", revision = "781e3528e2d5e0dc0c9c6fa1e409f5a4bc1cf0e2"},
]

